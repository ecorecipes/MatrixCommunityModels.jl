# The environment of the tests of the DecisionAnalysis.jl adapter
# (ext/MatrixCommunityModelsDecisionAnalysisExt.jl). It is separate from the test environment of
# the package because DecisionAnalysis.jl needs Julia 1.12 and this package supports 1.11, so it
# cannot be listed in `[extras]`. `test/runtests.jl` runs it on Julia 1.12 or later; directly:
#   julia --project=test/decision_analysis -e 'using Pkg; Pkg.instantiate()'
#   julia --project=test/decision_analysis test/decision_analysis/runtests.jl
# Pkg does not follow the `[sources]` of a URL dependency, so FiniteKernels, which
# DecisionAnalysis needs and which is not registered, is listed here too.
[deps]
DecisionAnalysis = "6a9d793e-d09c-4461-8cb4-55c12d181024"
FiniteKernels = "2ee73795-50db-4096-9573-22982ed4949b"
MatrixCommunityModels = "c9d7ffd9-8e9b-4c2f-8af4-9cd333236b7e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[sources]
DecisionAnalysis = {url = "https://github.com/ecorecipes/DecisionAnalysis.jl"}
FiniteKernels = {url = "https://github.com/ecorecipes/FiniteKernels.jl"}
MatrixCommunityModels = {path = "../.."}
